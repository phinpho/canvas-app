name: General Workflow

permissions:
  contents: read

on:
  push:
    branches-ignore:
      - main

jobs:
  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PNPM
        uses: pnpm/setup@v1
        with:
          runtime: node@22
          cache: true
          install: true

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
